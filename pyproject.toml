[project]
name = "chemtabextract"
version = "0.10.0"
description = "Extracts and standardises structured data from scientific tables using the MIPS algorithm."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.1",
  "numpy>=2.4.0",
  "pandas>=3.0.0",
  "prettytable>=3.17.0",
  "requests>=2.34.0",
]

[project.optional-dependencies]
web = [
  "selenium>=4.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemtabextract"]

[dependency-groups]
dev = [
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
  "pre-commit>=4.6.0",
  "ruff>=0.15.0",
  "mypy>=2.1.0",
  "types-requests>=2.33.0",
  "bandit>=1.9.0",
  "vulture>=2.16",
  "xenon>=0.9.3",
  "commitizen>=4.16.0",
  "lxml>=6.1.1",
]
docs = [
  "sphinx>=9.1.0",
  "m2r>=0.3.1",
  "nbsphinx>=0.9.8",
  "nbsphinx-link>=1.4.1",
  "jinja2>=3.1.6",
  "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["chemtabextract"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["examples/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
  "E501",  # line-too-long: many existing long lines in data-heavy test files
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = false
exclude = ["^docs/", "^examples/"]

[[tool.mypy.overrides]]
module = ["chemtabextract.table.algorithms._mips"]
# MIPS algorithm is frozen legacy code; type errors are not fixed to
# avoid inadvertent semantic changes to the algorithm.
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # B101: assert used in tests (excluded) and library internals

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.10.0"
version_files = ["pyproject.toml:version"]
version_provider = "pep621"
tag_format = "v$version"
